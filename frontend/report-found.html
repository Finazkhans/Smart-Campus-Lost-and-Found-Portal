
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found | CampusFind</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html">Campus<span>Find</span></a>
    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="search-items.html">Browse</a>
    </nav>
</header>

<main class="auth-wrap">
    <section class="auth-card wide">

        <p class="eyebrow">FOUND SOMETHING?</p>
        <h1>Report a Found Item</h1>
        <p class="muted">Help the owner find their belongings.</p>

        <form id="foundForm" data-type="found">

            <label>Item Name</label>
            <input type="text" name="title"
                placeholder="Example: Black notebook" required>

            <label>Category</label>
            <select name="category" required>
                <option value="">Select category</option>
                <option>Electronics</option>
                <option>Books and stationery</option>
                <option>ID card</option>
                <option>Clothing</option>
                <option>Accessories</option>
                <option>Other</option>
            </select>

            <label>Description</label>
            <textarea name="description"
                placeholder="Describe the item without revealing all identifying details"
                required></textarea>

            <label>Where did you find it?</label>
            <input type="text" name="location"
                placeholder="Example: College canteen" required>

            <label>Date Found</label>
            <input type="date" name="itemDate" required>

            <label>Upload Item Image</label>
            <input type="file" name="image" id="foundImage"
                accept="image/jpeg,image/png,image/webp">

            <p class="muted">Maximum image size: 5 MB.</p>

            <img id="foundPreview" alt="Selected item preview"
                style="display:none; width:200px; max-height:200px; object-fit:contain; margin:15px 0; border-radius:12px;">

            <button type="submit" class="btn full">
                Submit Found Report
            </button>

            <p id="formMessage" class="message"></p>

        </form>
    </section>
</main>

<script>
const foundImage = document.getElementById("foundImage");
const foundPreview = document.getElementById("foundPreview");

foundImage.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) {
        foundPreview.style.display = "none";
        return;
    }

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        alert("Please select a JPG, PNG or WEBP image.");
        this.value = "";
        foundPreview.style.display = "none";
        return;
    }

    if (file.size > 5 * 1024 * 1024) {
        alert("Image size must be less than 5 MB.");
        this.value = "";
        foundPreview.style.display = "none";
        return;
    }

    foundPreview.src = URL.createObjectURL(file);
    foundPreview.style.display = "block";
});
</script>

<script src="js/app.js"></script>
</body>
</html>
